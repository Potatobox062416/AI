name: Build Jin Jing Gan Kao assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jin-jing-gan-kao/scripts/build-deploy-assets.mjs"
      - "jin-jing-gan-kao/assets/restaurants/restaurant-image-credits.json"
      - "jin-jing-gan-kao/assets/restaurants/restaurant-image-replacements.json"

permissions:
  contents: write

concurrency:
  group: jin-jing-gan-kao-assets
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate image assets
        run: node jin-jing-gan-kao/scripts/build-deploy-assets.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jin-jing-gan-kao/assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Build Jin Jing Gan Kao image assets"
            git push
          fi
